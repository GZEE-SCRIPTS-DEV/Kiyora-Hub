:root{--bg:#07040f;--fg:#f1eefc;--mut:#cfc9ea;--ac:#b794ff;box-sizing:border-box}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;max-width:100%;overflow-x:clip}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-wrap:anywhere}
.vh{position:absolute;left:-9999px}
main{flex:1;display:flex;flex-direction:column;min-height:0}

:focus-visible{outline:3px solid var(--ac);outline-offset:-3px}
.desk{flex:1;position:relative;display:block;min-height:100vh;min-height:100dvh}
.desk img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%;display:block}
.mob{display:none;position:relative;text-align:center;padding:22px 16px}

.code{font-size:clamp(5rem,30vw,8.5rem);font-weight:800;line-height:1;letter-spacing:-.04em;margin:4px 0 0;background:linear-gradient(180deg,#fff,#b57bff 65%,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(168,85,247,.55))}
.mob h1{font-size:clamp(1.35rem,6.4vw,1.9rem);line-height:1.15;margin:6px 0 10px;text-transform:uppercase;letter-spacing:-.01em}.mob h1 span{color:#a855f7}
.msg{color:var(--mut);margin:0 auto;max-width:34ch}

 body:before{content:"";position:fixed;inset:0;background:url(404-desktop.webp) center/cover;opacity:.28;filter:blur(16px);z-index:-1}
 main{justify-content:center}
 .desk{display:none}.mob{display:block}
}
