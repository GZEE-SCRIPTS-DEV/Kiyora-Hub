
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 | Kiyora Hub</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 20px;
  font-family: Inter, Arial, sans-serif;
  color: #fff;
  background:
    radial-gradient(circle at 15% 15%, #58118b55, transparent 40%),
    radial-gradient(circle at 85% 85%, #a020b955, transparent 40%),
    #080610;
}

.container {
  width: 100%;
  max-width: 650px;
  text-align: center;
  padding: 40px 25px;
  position: relative;
  border: 1px solid #a020ff44;
  border-radius: 25px;
  background: #100b1dcc;
  box-shadow: 0 0 60px #8b16ff22;
  backdrop-filter: blur(15px);
  animation: appear .8s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.logo {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: 4px;
  margin-bottom: 30px;
}

.logo span {
  color: #b026ff;
}

.error {
  font-size: clamp(100px, 25vw, 175px);
  font-weight: 900;
  line-height: 1;
  background: linear-gradient(135deg, #a855f7, #ec72d0);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 25px #a020ff66);
}

h1 {
  font-size: clamp(22px, 5vw, 32px);
  margin: 20px 0 12px;
}

p {
  color: #aaa3bd;
  line-height: 1.7;
  margin-bottom: 25px;
}

.buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
}

.btn {
  display: inline-block;
  padding: 14px 22px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: bold;
  color: white;
  border: 1px solid #a855f7;
  transition: .25s;
}

.btn.primary {
  background: linear-gradient(135deg, #7925c9, #b026ff);
  border: none;
}

.btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 0 25px #a020ff66;
}

footer {
  margin-top: 35px;
  color: #77718b;
  font-size: 13px;
}

footer a {
  color: #b77aff;
  text-decoration: none;
  margin: 0 7px;
}

@media(max-width: 480px) {
  .container {
    padding: 35px 18px;
  }

  .buttons {
    flex-direction: column;
  }

  .btn {
    width: 100%;
  }
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<main class="container">

  <div class="logo">
    KIYORA <span>HUB</span>
  </div>

  <div class="error">404</div>

  <h1>Ops! Você se perdeu?</h1>

  <p>
    Parece que essa página desapareceu no universo
    do Kiyora Hub. O endereço pode estar incorreto
    ou a página não existe mais.
  </p>

  <div class="buttons">

    <a href="/" class="btn primary">
      ← Voltar ao início
    </a>

    <a
      href="https://wa.me/5599920029406"
      class="btn"
      target="_blank"
      rel="noopener noreferrer"
    >
      Falar com suporte
    </a>

  </div>

  <footer>
    <div>
      <a href="/privacidade.html">Privacidade</a>
      <a href="/termos.html">Termos</a>
      <a href="/suporte.html">Suporte</a>
    </div>

    <br>

    © <span id="year"></span> Kiyora Hub
    <br>
    Made with ♥
  </footer>

</main>

<script>
document.getElementById("year").textContent =
  new Date().getFullYear();
</script>

</body>
</html>
